{% extends "base.html" %}

{% block title %}Edit Project{% endblock %}

{% block content %}
<section class="contact">
  <h1 class="page-title">Edit <span>Project</span></h1>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, text in messages %}
      <div class="flash {{ category }}">{{ text }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" class="contact-form">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{ project.title }}" required>

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="4" required>{{ project.description }}</textarea>

    <label for="tech">Tools used (separate with commas)</label>
    <input type="text" id="tech" name="tech" value="{{ project.tech }}" required>

    <label for="image">Screenshot file name (optional)</label>
    <input type="text" id="image" name="image" value="{{ project.image }}">

    <label for="github">GitHub link (optional)</label>
    <input type="url" id="github" name="github" value="{{ project.github if project.github != '#' else '' }}">

    <label for="live">Live demo link (optional)</label>
    <input type="url" id="live" name="live" value="{{ project.live if project.live != '#' else '' }}">

    <button type="submit" class="btn primary">Save changes</button>
  </form>

  <p class="logout"><a href="{{ url_for('admin') }}">← Back to admin</a></p>
</section>
{% endblock %}
